<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fact Graph</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a0e14;
      color: #e6edf3;
      height: 100vh;
      overflow: hidden;
    }

    svg#graph {
      width: 100%;
      height: 100vh;
      display: block;
    }

    /* ── Hover card ── */
    #hover-card {
      position: fixed;
      max-width: 280px;
      background: rgba(16, 22, 30, 0.97);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 14px 16px;
      display: none;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
      z-index: 100;
      backdrop-filter: blur(12px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
      opacity: 0;
      transition: opacity 120ms ease;
    }
    #hover-card.visible {
      display: flex;
      opacity: 1;
    }

    #hc-community {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 3px 9px;
      border-radius: 20px;
      align-self: flex-start;
    }

    #hc-text {
      font-size: 13px;
      line-height: 1.65;
      color: #e6edf3;
    }

    #hc-topics {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .hc-topic {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 10px;
      background: rgba(255,255,255,0.07);
      color: #8b949e;
    }

    #hc-connections { display: flex; flex-direction: column; gap: 6px; }

    .hc-divider {
      height: 1px;
      background: rgba(255,255,255,0.07);
      margin: 2px 0;
    }

    .hc-conn-heading {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #4a5568;
    }

    .hc-conn-item {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      font-size: 11px;
      line-height: 1.5;
      color: #c9d1d9;
    }

    .hc-conn-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 4px;
    }

    /* ── Legend ── */
    #legend {
      position: fixed;
      bottom: 16px;
      left: 16px;
      background: rgba(16, 22, 30, 0.85);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
      z-index: 10;
    }

    .legend-row { display: flex; align-items: center; gap: 8px; color: #8b949e; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .legend-line { width: 28px; height: 0; border-top: 2px solid #555; }
    .legend-bridge { border-top: 2px dashed #e67e22; }

    /* ── Loading overlay ── */
    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0e14;
      color: #8b949e;
      font-size: 14px;
      flex-direction: column;
      gap: 8px;
      z-index: 200;
    }
    #overlay.hidden { display: none; }
    #overlay-title { font-size: 16px; font-weight: 600; color: #e6edf3; }
  </style>
</head>
<body>

<svg id="graph"></svg>

<div id="hover-card">
  <span id="hc-community"></span>
  <p id="hc-text"></p>
  <div id="hc-topics"></div>
  <div id="hc-connections"></div>
</div>

<div id="legend">
  <div class="legend-row">
    <div class="legend-line"></div>
    <span>Same cluster</span>
  </div>
  <div class="legend-row">
    <div class="legend-line legend-bridge"></div>
    <span>Bridge (cross-cluster)</span>
  </div>
</div>

<div id="overlay">
  <div id="overlay-title">Loading graph…</div>
  <div id="overlay-msg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script>
// ── Config ────────────────────────────────────────────────────────────────────
// Update to your Fly.io URL before deploying to GitHub Pages.
const BACKEND_URL = 'http://localhost:8000';

// ── Color ─────────────────────────────────────────────────────────────────────
function nodeColor(d) {
  if (d.community_id == null || d.community_id === -1) return '#4a5568';
  const hue = (d.community_id * 137.508) % 360;
  return `hsl(${hue}, 62%, 56%)`;
}
function nodeHue(d) {
  return (d.community_id * 137.508) % 360;
}

// ── Overlay ───────────────────────────────────────────────────────────────────
function showOverlay(title, msg = '') {
  const el = document.getElementById('overlay');
  el.classList.remove('hidden');
  document.getElementById('overlay-title').textContent = title;
  document.getElementById('overlay-msg').textContent = msg;
}
function hideOverlay() {
  document.getElementById('overlay').classList.add('hidden');
}

// ── Hover card ────────────────────────────────────────────────────────────────
const card = document.getElementById('hover-card');

// Populated in renderGraph once edges are known
let bridgeNeighborMap = new Map();

function truncate(text, words = 7) {
  const w = text.split(/\s+/);
  return w.length > words ? w.slice(0, words).join(' ') + '…' : text;
}

function showCard(event, d) {
  const hue = nodeHue(d);

  document.getElementById('hc-community').textContent =
    d.community_label || (d.community_id !== -1 ? `Community ${d.community_id}` : 'Unclustered');
  document.getElementById('hc-community').style.cssText =
    `background: hsla(${hue}, 55%, 35%, 0.5); color: hsl(${hue}, 80%, 75%);`;

  document.getElementById('hc-text').textContent = d.raw_text;

  const topicsEl = document.getElementById('hc-topics');
  topicsEl.innerHTML = '';
  (d.topics || []).forEach(t => {
    const span = document.createElement('span');
    span.className = 'hc-topic';
    span.textContent = t.replace(/_/g, ' ');
    topicsEl.appendChild(span);
  });

  // Position near cursor, clamped to viewport
  const cw = card.offsetWidth || 280;
  const ch = card.offsetHeight || 160;
  const margin = 16;
  let x = event.clientX + 18;
  let y = event.clientY - 20;
  if (x + cw + margin > window.innerWidth)  x = event.clientX - cw - 18;
  if (y + ch + margin > window.innerHeight) y = window.innerHeight - ch - margin;
  if (y < margin) y = margin;

  card.style.left = `${x}px`;
  card.style.top  = `${y}px`;

  // Bridge neighbors
  const connEl = document.getElementById('hc-connections');
  connEl.innerHTML = '';
  const neighbors = bridgeNeighborMap.get(d.id) || [];
  if (neighbors.length > 0) {
    const div = document.createElement('div');
    div.className = 'hc-divider';
    connEl.appendChild(div);

    const heading = document.createElement('div');
    heading.className = 'hc-conn-heading';
    heading.textContent = 'Connected across clusters';
    connEl.appendChild(heading);

    neighbors.slice(0, 5).forEach(nb => {
      const h = (nb.community_id * 137.508) % 360;
      const item = document.createElement('div');
      item.className = 'hc-conn-item';
      item.innerHTML = `
        <div class="hc-conn-dot" style="background:hsl(${h},62%,56%)"></div>
        <span>${truncate(nb.raw_text)}</span>`;
      connEl.appendChild(item);
    });
  }

  card.classList.add('visible');
}

function hideCard() {
  card.classList.remove('visible');
  setTimeout(() => { if (!card.classList.contains('visible')) card.style.display = ''; }, 130);
}

// ── Main ──────────────────────────────────────────────────────────────────────
async function init() {
  let data;
  try {
    const res = await fetch('./graph.json');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    data = await res.json();
  } catch (err) {
    showOverlay('Could not load graph.json', err.message + ' — run the export pipeline step first.');
    return;
  }

  if (!data.nodes || data.nodes.length === 0) {
    showOverlay('Graph is empty', 'Run the full pipeline (ingest → export) to populate items.');
    return;
  }

  hideOverlay();
  renderGraph(data);
}

function renderGraph(data) {
  const W = window.innerWidth;
  const H = window.innerHeight;

  const svg = d3.select('#graph').attr('viewBox', `0 0 ${W} ${H}`);

  // ── SVG defs: halo blur + node glow ─────────────────────────────────────
  const defs = svg.append('defs');
  defs.append('filter')
    .attr('id', 'halo-blur')
    .attr('x', '-60%').attr('y', '-60%')
    .attr('width', '220%').attr('height', '220%')
    .append('feGaussianBlur')
    .attr('in', 'SourceGraphic')
    .attr('stdDeviation', 32);

  // ── Root group — zoom/pan ────────────────────────────────────────────────
  const root = svg.append('g');

  // ── Degree map ───────────────────────────────────────────────────────────
  const degree = new Map(data.nodes.map(n => [n.id, 0]));
  data.edges.forEach(e => {
    const s = typeof e.source === 'object' ? e.source.id : e.source;
    const t = typeof e.target === 'object' ? e.target.id : e.target;
    degree.set(s, (degree.get(s) || 0) + 1);
    degree.set(t, (degree.get(t) || 0) + 1);
  });
  const maxDeg = d3.max([...degree.values()]) || 1;
  const rScale = d3.scaleSqrt().domain([0, maxDeg]).range([8, 17]);
  const nodeR = d => rScale(degree.get(d.id) || 0);

  // ── Split edges ──────────────────────────────────────────────────────────
  const clusterEdges = data.edges.filter(e => e.type === 'cluster');
  const bridgeEdges  = data.edges.filter(e => e.type === 'bridge');

  // Build bridge neighbor lookup (node id → [neighbor node, …])
  // D3 resolves source/target to node objects after forceLink runs, so we
  // build from the raw id values here and re-index by resolved objects later.
  const nodeById = new Map(data.nodes.map(n => [n.id, n]));
  bridgeNeighborMap = new Map(data.nodes.map(n => [n.id, []]));
  bridgeEdges.forEach(e => {
    const sid = typeof e.source === 'object' ? e.source.id : e.source;
    const tid = typeof e.target === 'object' ? e.target.id : e.target;
    if (nodeById.has(sid) && nodeById.has(tid)) {
      bridgeNeighborMap.get(sid).push(nodeById.get(tid));
      bridgeNeighborMap.get(tid).push(nodeById.get(sid));
    }
  });

  // ── Force simulation ─────────────────────────────────────────────────────
  const simulation = d3.forceSimulation(data.nodes)
    .alphaDecay(0.04)      // default 0.0228 — decays ~2× faster, settles in ~half the time
    .velocityDecay(0.45)   // slightly more damping, less oscillation before rest
    .force('link',
      d3.forceLink(data.edges)
        .id(d => d.id)
        .distance(e => e.type === 'cluster' ? 65 : 210)
        .strength(e => e.type === 'cluster' ? 0.6 : 0.12)
    )
    .force('charge',    d3.forceManyBody().strength(-200))
    .force('center',    d3.forceCenter(W / 2, H / 2))
    .force('collision', d3.forceCollide(d => nodeR(d) + 6));

  // ── Cluster halos (behind everything) ───────────────────────────────────
  const haloGroup = root.append('g').attr('class', 'halos');
  const communities = d3.group(data.nodes, d => d.community_id);

  const halos = haloGroup.selectAll('circle')
    .data([...communities.entries()].filter(([id]) => id !== -1 && id !== null))
    .join('circle')
    .attr('fill', ([id]) => { const h = (id * 137.508) % 360; return `hsl(${h}, 55%, 30%)`; })
    .attr('opacity', 0.16)
    .attr('filter', 'url(#halo-blur)')
    .style('pointer-events', 'none');

  // ── Edges ────────────────────────────────────────────────────────────────
  const clusterLineGroup = root.append('g').attr('class', 'cluster-edges');
  const bridgeLineGroup  = root.append('g').attr('class', 'bridge-edges');

  const clusterLine = clusterLineGroup
    .selectAll('line')
    .data(clusterEdges)
    .join('line')
    .attr('stroke', '#3a4250')
    .attr('stroke-opacity', 0.55)
    .attr('stroke-width', 1.2);

  const bridgeLine = bridgeLineGroup
    .selectAll('line')
    .data(bridgeEdges)
    .join('line')
    .attr('stroke', '#e67e22')
    .attr('stroke-opacity', 0)       // hidden by default
    .attr('stroke-width', 1.2)
    .attr('stroke-dasharray', '5 3');

  // ── Nodes ────────────────────────────────────────────────────────────────
  const nodeGroup = root.append('g').attr('class', 'nodes');

  const node = nodeGroup
    .selectAll('circle')
    .data(data.nodes)
    .join('circle')
    .attr('r', nodeR)
    .attr('fill', nodeColor)
    .attr('stroke', '#0a0e14')
    .attr('stroke-width', 1.5)
    .style('cursor', 'pointer')
    .style('filter', d => {
      if (d.community_id == null || d.community_id === -1) return 'none';
      const h = nodeHue(d);
      return `drop-shadow(0 0 5px hsl(${h}, 70%, 55%))`;
    })
    .on('mouseenter', function(event, d) {
      showCard(event, d);
      // Show this node's bridge edges
      bridgeLine.attr('stroke-opacity', e => {
        const s = typeof e.source === 'object' ? e.source.id : e.source;
        const t = typeof e.target === 'object' ? e.target.id : e.target;
        return (s === d.id || t === d.id) ? 0.55 : 0;
      });
      d3.select(this).attr('stroke', '#ffffff').attr('stroke-width', 2.5);
    })
    .on('mousemove', function(event, d) {
      // Reposition card as cursor moves
      const cw = card.offsetWidth || 280;
      const ch = card.offsetHeight || 160;
      const margin = 16;
      let x = event.clientX + 18;
      let y = event.clientY - 20;
      if (x + cw + margin > window.innerWidth)  x = event.clientX - cw - 18;
      if (y + ch + margin > window.innerHeight) y = window.innerHeight - ch - margin;
      if (y < margin) y = margin;
      card.style.left = `${x}px`;
      card.style.top  = `${y}px`;
    })
    .on('mouseleave', function(event, d) {
      hideCard();
      bridgeLine.attr('stroke-opacity', 0);
      d3.select(this).attr('stroke', '#0a0e14').attr('stroke-width', 1.5);
    })
    .call(
      d3.drag()
        .on('start', (event, d) => {
          if (!event.active) simulation.alphaTarget(0.3).restart();
          d.fx = d.x; d.fy = d.y;
        })
        .on('drag', (event, d) => { d.fx = event.x; d.fy = event.y; })
        .on('end', (event, d) => {
          if (!event.active) simulation.alphaTarget(0);
          d.fx = null; d.fy = null;
        })
    );

  // ── Community centroid labels ─────────────────────────────────────────────
  const communityLabelGroup = root.append('g').attr('class', 'community-labels');

  const communityLabels = communityLabelGroup
    .selectAll('text')
    .data([...communities.entries()].filter(([id]) => id !== -1 && id !== null))
    .join('text')
    .text(([, nodes]) => nodes[0].community_label || '')
    .attr('font-size', '13px')
    .attr('font-weight', '700')
    .attr('fill', ([id]) => { const h = (id * 137.508) % 360; return `hsl(${h}, 75%, 72%)`; })
    .attr('text-anchor', 'middle')
    .attr('opacity', 0)
    .style('pointer-events', 'none')
    .style('user-select', 'none')
    .style('text-shadow', '0 1px 4px rgba(0,0,0,0.9)');

  // ── Node truncated labels (zoom-dependent) ───────────────────────────────
  const labelGroup = root.append('g').attr('class', 'labels');

  const label = labelGroup
    .selectAll('text')
    .data(data.nodes)
    .join('text')
    .text(d => d.label)
    .attr('font-size', '9px')
    .attr('fill', '#8b949e')
    .attr('text-anchor', 'middle')
    .attr('dy', d => nodeR(d) + 11)
    .attr('opacity', 0)              // hidden until zoomed in
    .style('pointer-events', 'none')
    .style('user-select', 'none');

  // ── Zoom ─────────────────────────────────────────────────────────────────
  let currentK = 1;
  const zoom = d3.zoom()
    .scaleExtent([0.1, 6])
    .on('zoom', e => {
      root.attr('transform', e.transform);
      currentK = e.transform.k;
      label.attr('opacity', currentK > 1.8 ? Math.min((currentK - 1.8) / 0.6, 1) : 0);
    });
  svg.call(zoom);

  // Start zoomed out so the full graph is visible on load
  const initialScale = 0.45;
  svg.call(
    zoom.transform,
    d3.zoomIdentity
      .translate(W * (1 - initialScale) / 2, H * (1 - initialScale) / 2)
      .scale(initialScale)
  );

  // ── Tick ─────────────────────────────────────────────────────────────────
  simulation.on('tick', () => {
    clusterLine
      .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x).attr('y2', d => d.target.y);

    bridgeLine
      .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x).attr('y2', d => d.target.y);

    node.attr('cx', d => d.x).attr('cy', d => d.y);
    label.attr('x', d => d.x).attr('y', d => d.y);

    communityLabels
      .attr('x', ([, nodes]) => d3.mean(nodes, n => n.x))
      .attr('y', ([, nodes]) => d3.min(nodes, n => n.y) - 16);

    // Halos: center on community centroid, radius = spread + padding
    halos
      .attr('cx', ([, nodes]) => d3.mean(nodes, n => n.x))
      .attr('cy', ([, nodes]) => d3.mean(nodes, n => n.y))
      .attr('r', ([, nodes]) => {
        const cx = d3.mean(nodes, n => n.x);
        const cy = d3.mean(nodes, n => n.y);
        const spread = d3.max(nodes, n => Math.hypot(n.x - cx, n.y - cy));
        return Math.max(36, spread + 36);
      });
  });

  // ── Community labels fade in after a moment ──────────────────────────────
  setTimeout(() => {
    communityLabels.transition().duration(800).attr('opacity', 0.9);
  }, 2000);

  // ── Continuous ambient drift ──────────────────────────────────────────────
  // Reads live simulation positions each frame — works from first render,
  // no waiting for settlement. Amplitude is ~2px (barely perceptible motion).
  const phase = new Map(data.nodes.map(n => [n.id, Math.random() * Math.PI * 2]));
  const freq  = 0.00035;
  const amp   = 8;

  function drift(t) {
    const ox = id => amp * Math.sin(t * freq + phase.get(id));
    const oy = id => amp * Math.cos(t * freq * 0.73 + phase.get(id));

    node
      .attr('cx', d => d.x + ox(d.id))
      .attr('cy', d => d.y + oy(d.id));

    label
      .attr('x', d => d.x + ox(d.id))
      .attr('y', d => d.y + oy(d.id));

    clusterLine
      .attr('x1', d => d.source.x + ox(d.source.id))
      .attr('y1', d => d.source.y + oy(d.source.id))
      .attr('x2', d => d.target.x + ox(d.target.id))
      .attr('y2', d => d.target.y + oy(d.target.id));

    bridgeLine
      .attr('x1', d => d.source.x + ox(d.source.id))
      .attr('y1', d => d.source.y + oy(d.source.id))
      .attr('x2', d => d.target.x + ox(d.target.id))
      .attr('y2', d => d.target.y + oy(d.target.id));

    // Community labels follow their cluster centroid with drift applied
    communityLabels
      .attr('x', ([, nodes]) => d3.mean(nodes, n => n.x + ox(n.id)))
      .attr('y', ([, nodes]) => d3.min(nodes, n => n.y + oy(n.id)) - 16);

    requestAnimationFrame(drift);
  }
  requestAnimationFrame(drift);
}

init();
</script>
</body>
</html>
